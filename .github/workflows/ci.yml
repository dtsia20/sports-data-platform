name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  tests:
    name: Tests and Code Quality
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_DB: sports_data_test
          POSTGRES_USER: sports_data
          POSTGRES_PASSWORD: sports_data

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U sports_data -d sports_data_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_ENV: testing
      APP_DEBUG: false

      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: sports_data_test
      DB_USERNAME: sports_data
      DB_PASSWORD: sports_data

      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check PHP platform requirements
        run: composer check-platform-reqs

      - name: Check code style
        run: ./vendor/bin/pint --test

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Run tests
        run: php artisan test