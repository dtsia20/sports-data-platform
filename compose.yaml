services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
        ports:
            - "8000:8000"
        depends_on:
            postgres:
                condition: service_healthy

    postgres:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: sports_data
            POSTGRES_USER: sports_data
            POSTGRES_PASSWORD: sports_data
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U sports_data -d sports_data"
                ]
            interval: 5s
            timeout: 5s
            retries: 5

    adminer:
        image: adminer:latest
        ports:
            - "8080:8080"
        depends_on:
            postgres:
                condition: service_healthy

volumes:
    postgres_data: