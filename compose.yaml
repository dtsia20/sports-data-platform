x-php-service: &php-service
    build:
        context: .
        dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    volumes:
        - .:/var/www/html
    depends_on:
        postgres:
            condition: service_healthy
services:
    app:
        <<: *php-service
        ports:
            - "8000:8000"

    worker:
        <<: *php-service
        profiles: [background]
        init: true
        restart: unless-stopped
        stop_grace_period: 75s
        command: [php, artisan, queue:work, database, --sleep=1, --timeout=60, --max-time=3600]

    scheduler:
        <<: *php-service
        profiles: [background]
        init: true
        restart: unless-stopped
        stop_grace_period: 75s
        command: [php, artisan, schedule:work]

    postgres:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: sports_data
            POSTGRES_USER: sports_data
            POSTGRES_PASSWORD: sports_data
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U sports_data -d sports_data"
                ]
            interval: 5s
            timeout: 5s
            retries: 5

    adminer:
        image: adminer:latest
        ports:
            - "8080:8080"
        depends_on:
            postgres:
                condition: service_healthy

volumes:
    postgres_data:
